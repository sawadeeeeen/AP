<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AP試験 学習トラッカー{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: 0.05em; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .weak-badge { background-color: #fee2e2; color: #b91c1c; }
    .strong-badge { background-color: #dcfce7; color: #15803d; }
    .rate-bar { height: 8px; border-radius: 4px; }
    .nav-link.active { font-weight: 600; }
    .stat-card { border-left: 4px solid; }
    .stat-card.blue { border-color: #3b82f6; }
    .stat-card.green { border-color: #22c55e; }
    .stat-card.orange { border-color: #f97316; }
    .stat-card.purple { border-color: #a855f7; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="bi bi-journal-check me-2"></i>AP試験 学習トラッカー
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
              <i class="bi bi-house me-1"></i>ダッシュボード
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/study' %}active{% endif %}" href="/study">
              <i class="bi bi-book me-1"></i>学習記録
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/quiz' %}active{% endif %}" href="/quiz">
              <i class="bi bi-pencil-square me-1"></i>問題演習
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/stats' %}active{% endif %}" href="/stats">
              <i class="bi bi-bar-chart me-1"></i>統計
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
